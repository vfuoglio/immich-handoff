name: ci
# CI runs when something is merged toward main, not on every change in develop:
#   - a pull request (develop into main) and pushes to main
#   - by hand: Actions, ci, Run workflow, on any branch
#   - from the release workflow, which runs the same checks first
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generated code (Immich client, templates, the page's script bundle) is up to date
        run: go generate ./... && git diff --exit-code
      - name: The release script that decides which version gets the latest tag
        run: .github/scripts/latest_test.sh
      - name: The script that decides which nightly tags are removed
        run: .github/scripts/prune_nightly_test.sh
      - run: go vet ./... && go vet -tags e2e ./...
      - run: go test -race ./...
  types:
    # The page's scripts are TypeScript (internal/web/ts). Building and running the program needs no Node: esbuild
    # is a Go tool and the bundle is committed. Node is used here only, to check the types and run the page's few script tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/typecheck/package-lock.json
      - name: The page's TypeScript type-checks and its tests pass
        working-directory: tools/typecheck
        run: npm ci --ignore-scripts && npm run check && npm test
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: End-to-end tests against a throwaway Immich
        run: test/run.sh
