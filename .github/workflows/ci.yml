name: ci
on:
  push:
  pull_request:
  workflow_call:   # the release workflow runs the same checks first
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Generated code (Immich client, templates) is up to date
        run: go generate ./... && git diff --exit-code
      - run: go vet ./... && go vet -tags e2e ./...
      - run: go test -race ./...
  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: End-to-end tests against a throwaway Immich
        run: test/run.sh
