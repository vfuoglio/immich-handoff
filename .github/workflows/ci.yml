name: ci
# CI runs when something is about to reach main, not on every change in develop:
#   - a pull request into main (the release pull request); main is not tested again when it is merged
#   - once a day on develop, if it changed (develop-check.yml)
#   - by hand: Actions, ci, Run workflow, on any branch
#   - from the release and nightly workflows, which run the same checks first
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Branch or commit to test; empty means the one that started the run"
        type: string
        default: ""
jobs:
  checks:
    # Everything that is not the race detector: generated code, the scripts' own tests, vet, and the unit tests of the packages
    # without goroutines (.github/scripts/unit.sh says which).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: Generated code (Immich client, templates, the page's script bundle) is up to date
        run: go generate ./... && git diff --exit-code
      - name: The release script that decides which version gets the latest tag
        run: .github/scripts/latest_test.sh
      - name: The script that decides which nightly tags are removed
        run: .github/scripts/prune_nightly_test.sh
      - name: Every end-to-end test is in exactly one group (see e2e below)
        run: .github/scripts/e2e_groups_test.sh
      - name: Every link and anchor in the documentation points at something that exists
        run: .github/scripts/doc_links_test.sh
      - name: Every package is in exactly one group of unit tests (see race below)
        run: .github/scripts/unit_test.sh
      - run: go vet ./... && go vet -tags e2e ./...
      - run: .github/scripts/unit.sh plain
  race:
    # The race detector makes tests 15 to 30 times slower, so it runs only on the packages with goroutines, and the two biggest of
    # them (hub, web) are cut into shards that run at the same time. The wall time is the slowest shard.
    name: race (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: hub 1/4, args: "shard internal/hub 1 4" }
          - { name: hub 2/4, args: "shard internal/hub 2 4" }
          - { name: hub 3/4, args: "shard internal/hub 3 4" }
          - { name: hub 4/4, args: "shard internal/hub 4 4" }
          - { name: web 1/3, args: "shard internal/web 1 3" }
          - { name: web 2/3, args: "shard internal/web 2 3" }
          - { name: web 3/3, args: "shard internal/web 3 3" }
          - { name: the others, args: "race" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - run: .github/scripts/unit.sh ${{ matrix.args }}
  test:
    # The one result that branch protection asks for (it used to be a single job of this name): green only when the checks and
    # every race shard are.
    needs: [checks, race]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: The checks and every race shard passed
        env:
          CHECKS: ${{ needs.checks.result }}
          RACE: ${{ needs.race.result }}
        run: |
          echo "checks: $CHECKS, race: $RACE"
          [ "$CHECKS" = success ] && [ "$RACE" = success ]
  pets:
    # The optional pet sidecar (pet-sidecar/) is a second image: it is built here and the sample photos are posted to it, so a change to it
    # (or to a model it downloads) that stops it finding the animals is seen before a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - name: Build the image (the models are checked against their checksums)
        run: docker build -t pet-sidecar pet-sidecar
      - name: The image runs as a user with no privileges and says it is healthy
        run: |
          [ "$(docker run --rm --entrypoint id pet-sidecar -u)" != 0 ] || { echo "::error::the pet sidecar runs as root"; exit 1; }
          [ "$(docker inspect -f '{{if .Config.Healthcheck}}yes{{end}}' pet-sidecar)" = yes ] || { echo "::error::the pet sidecar has no HEALTHCHECK"; exit 1; }
      - name: The sample photos find the sample animals
        working-directory: pet-sidecar
        run: |
          docker run -d --name pets -p 8090:8090 pet-sidecar
          for i in $(seq 1 30); do curl -fs http://localhost:8090/ping >/dev/null && break; sleep 2; done
          python3 -m pip install --quiet pillow
          python3 check.py http://localhost:8090 || { docker logs pets; exit 1; }
  types:
    # The page's scripts are TypeScript (internal/web/ts). Building and running the program needs no Node: esbuild
    # is a Go tool and the bundle is committed. Node is used here only, to check the types and run the page's few script tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/typecheck/package-lock.json
      - name: The page's TypeScript type-checks and its tests pass
        working-directory: tools/typecheck
        run: npm ci --ignore-scripts && npm run check && npm test
  e2e-groups:
    # The end-to-end tests take about five minutes one after another, so they run as seven groups at the same time
    # (test/groups.sh), each against its own throwaway Immich. They do not wait for the unit tests: a failure there
    # shows up on its own, and the wall time is the longest group, not the sum.
    name: e2e (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [browser, core, core2, hub, hub2, hub3, bridge]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: "${{ inputs.ref }}" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod }
      - name: End-to-end tests against a throwaway Immich
        run: test/run.sh ${{ matrix.group }}
  e2e:
    # The one result that branch protection asks for (it used to be a single job of this name): green only when
    # every group is.
    needs: e2e-groups
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every end-to-end group passed
        env:
          RESULT: ${{ needs.e2e-groups.result }}
        run: |
          echo "the end-to-end groups: $RESULT"
          [ "$RESULT" = success ]
