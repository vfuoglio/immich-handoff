name: release
# Publishes the container image to Docker Hub and GitHub's registry (and, for a version tag, a GitHub Release).
#   - push a tag such as v1.2.3: tests, build, smoke test, publish 1.2.3, 1.2 and latest, create the release
#   - run by hand from the Actions tab with a version such as 0.0.0-test: the same checks, but only that one
#     image tag is published and no release is created. Use it to try the workflow out.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (for example 0.0.0-test)"
        required: true
permissions:
  contents: read
  packages: write
jobs:
  test:
    uses: ./.github/workflows/ci.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release
      packages: write
      id-token: write   # for signing the image without a key of ours (cosign, keyless)
    env:
      # the same image and tags go to both registries; Docker Hub is the one the documentation names
      DOCKERHUB_IMAGE: vfuoglio/immich-handoff
      GHCR_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the version
        id: v
        run: |
          raw="${{ inputs.version || github.ref_name }}"
          v="${raw#v}"
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$raw' is not a version like 1.2.3 or 1.2.3-rc1"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${v%%-*}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
          final=false; [[ "$v" != *-* ]] && final=true   # no -rc1, -test or similar suffix
          echo "final=$final" >> "$GITHUB_OUTPUT"
          # `latest` goes only to a tag push of a final version that is the highest released so far, so a fix
          # for an older line (1.1.1 when 1.2.0 exists) does not take it back; the X.Y tag below still moves
          latest=false
          if [ "${{ github.event_name }}" = push ] && [ "$final" = true ]; then
            latest="$(git ls-remote --tags --refs origin 'refs/tags/v*' | sed 's#.*refs/tags/##' | .github/scripts/latest.sh "$v")"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: The changelog describes this version
        if: github.event_name == 'push'
        run: |
          v="${{ steps.v.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error::CHANGELOG.md has no '## $v' section with content"; exit 1; fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build each architecture and smoke-test it
        run: |
          v="${{ steps.v.outputs.version }}"
          for arch in amd64 arm64; do
            docker buildx build --platform linux/$arch --build-arg VERSION="$v" -t smoke:$arch --load .
            got="$(docker run --rm --platform linux/$arch smoke:$arch --version)"
            [ "$got" = "$v" ] || { echo "::error::$arch reports version '$got', expected '$v'"; exit 1; }
            # with no configuration it must refuse to start and say why; this proves the binary runs as the
            # unprivileged user on that architecture
            set +e; out="$(docker run --rm --platform linux/$arch smoke:$arch 2>&1)"; code=$?; set -e
            [ "$code" -ne 0 ] && grep -q WEBHOOK_SECRET <<<"$out" || { echo "::error::$arch did not fail cleanly without configuration: $out"; exit 1; }
            # the image declares its health check, and the check says so (non-zero) when the app is not running
            [ "$(docker inspect -f '{{if .Config.Healthcheck}}yes{{end}}' smoke:$arch)" = yes ] || { echo "::error::$arch image has no HEALTHCHECK"; exit 1; }
            set +e; out="$(docker run --rm --platform linux/$arch smoke:$arch --healthcheck 2>&1)"; code=$?; set -e
            [ "$code" -ne 0 ] && grep -q "healthcheck failed" <<<"$out" || { echo "::error::$arch --healthcheck did not fail cleanly with no app running: $out"; exit 1; }
          done

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=${{ steps.v.outputs.minor }},enable=${{ steps.v.outputs.final == 'true' || github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ steps.v.outputs.latest == 'true' }}

      - name: Publish the multi-architecture image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          sbom: true              # a software bill of materials, attached to the image
          provenance: mode=max    # and how and from what it was built

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign the image, then check the signature and the attached SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::the publish step gave no image digest"; exit 1; }
          for img in "$DOCKERHUB_IMAGE" "$GHCR_IMAGE"; do
            # keyless: the signature is tied to this workflow by GitHub's identity token
            # The signature is stored as a tag (sha256-<digest>.sig) next to the image: cosign 3's default, a bundle
            # attached as an OCI referrer, is accepted by Docker Hub but cannot be listed there again, so the check
            # found "no signatures". The tag form works on Docker Hub and on GitHub's registry.
            cosign sign --yes --new-bundle-format=false --use-signing-config=false "$img@$DIGEST"
            ok=false
            for attempt in 1 2 3 4 5; do # a registry can take a moment to list what was just pushed
              if cosign verify --new-bundle-format=false \
                --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                "$img@$DIGEST" > /dev/null; then ok=true; break; fi
              echo "::warning::signature of $img not found yet (attempt $attempt of 5)"; sleep 10
            done
            $ok || { echo "::error::the signature of $img could not be verified"; exit 1; }
            docker buildx imagetools inspect "$img@$DIGEST" --format '{{json .SBOM}}' \
              | jq -e '[.. | .packages? // empty | length] | add > 0' > /dev/null \
              || { echo "::error::$img has no SBOM"; exit 1; }
            echo "$img: signed, signature verified, SBOM present"
          done

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [[ "${{ steps.v.outputs.version }}" == *-* ]] && pre="--prerelease"
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file notes.md $pre
