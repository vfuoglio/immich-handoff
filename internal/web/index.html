<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Immich Handoff</title>
<body style="font-family:system-ui;max-width:40rem;margin:2rem auto;padding:0 1rem">
<h1>Immich Handoff</h1><div id=out>Loading…</div>
<p><button id=sync>Sync now</button></p>
<script>
async function load(){
  const o=document.getElementById('out'); o.textContent='';
  const add=t=>{const p=document.createElement('p');p.textContent=t;o.append(p)};
  const r=await fetch('api/status');
  if(!r.ok){add(r.status==401?'Sign in to Immich first, then reload this page.':(await r.json()).detail);return}
  const s=await r.json(), l=s.lastRun;
  add('Signed in as '+s.user);
  for(const v of s.services){add((v.role=='sender'?'Sending '+v.name+' (tag '+v.tag+'): '+v.waiting+' waiting':'Receiving '+v.name+' (tag '+v.tag+'): '+v.waiting+' photos'));}
  add(l?('Last run '+l.Finished+' ('+l.Reason+'): '+JSON.stringify(l.Counts)+(l.Error?' ERROR '+l.Error:'')):'No run yet since start');
}
document.getElementById('sync').onclick=async()=>{
  await fetch('api/sync',{method:'POST',headers:{'X-Requested-With':'immich-handoff'}});
  setTimeout(load,3000);
};
load();
</script>
