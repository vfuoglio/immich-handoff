services:
  immich-handoff:
    image: vfuoglio/immich-handoff:1.1   # prebuilt; to build from source see docker-compose.build.yml
    restart: unless-stopped
    env_file: .env
    volumes:
      - handoff-data:/data                  # only used when HANDOFF_STORE_KEY is set
      # - ./routes.yaml:/routes.yaml:ro   # only with ROUTES_FILE=/routes.yaml
    ports:
      - "8080:8080"
    networks:
      - immich

volumes:
  handoff-data:

networks:
  immich:
    # The network your Immich containers are on. A default Immich install uses immich_default.
    name: ${IMMICH_NETWORK:-immich_default}
    external: true
