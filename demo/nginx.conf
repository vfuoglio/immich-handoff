# One address for Immich and for Handoff, as docs/find-handoff.md describes: Immich at /, the app under /handoff/, and
# one script tag added to Immich's pages for people who are signed in, which is what puts the Handoff link and the
# Hand over... button inside Immich.
map $cookie_immich_is_authenticated $handoff_script {
  default '</body>';
  'true'  '<script src="/handoff/static/immich-button.js" defer></script></body>';
}
server {
  listen 80;
  client_max_body_size 0;

  location /handoff/ {
    proxy_pass http://immich-handoff:8080/;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://immich-server:2283;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Accept-Encoding "";
    sub_filter_once on;
    sub_filter '</body>' $handoff_script;
  }
}
