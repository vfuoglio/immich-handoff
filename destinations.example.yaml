# Where services may hand photos to besides an Immich account. Point DESTINATIONS_FILE at this file (mounted into the container), then give
# a service one of these names: a service owner picks it on the service's card, or a service of the routes file names it under `destinations:`.
# A value can be ${VAR} (read from the environment) and a setting called x_file reads x from that file, for Docker secrets.
destinations:
  # A folder inside the container: mount the share there (see docker-compose.yml). The app runs as user 65532 and must be able to write in it.
  nas:
    kind: folder
    root: /destinations/nas

  # The kinds below are described in docs/design/destinations-design.md and arrive one by one.
  # cloud:
  #   kind: webdav
  #   url: https://cloud.example.org/remote.php/dav/files/me
  #   user: me
  #   password_file: /run/secrets/webdav_password
  # bucket:
  #   kind: s3
  #   endpoint: https://s3.example.org     # empty for Amazon
  #   bucket: photos
  #   access_key: ${S3_ACCESS_KEY}
  #   secret_key_file: /run/secrets/s3_secret
  # server:
  #   kind: sftp
  #   host: nas.example.org
  #   user: backup
  #   private_key_file: /run/secrets/sftp_key
